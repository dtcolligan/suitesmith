[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "suitesmith"
version = "0.1.0"
description = "RL environment: train a small model to write pytest suites that pass a reference implementation and kill its mutants"
requires-python = ">=3.11,<3.14"
dependencies = ["verifiers>=0.2.0", "datasets>=2.19", "pytest>=8"]

[tool.setuptools]
packages = ["suitesmith"]
